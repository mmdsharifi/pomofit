name: Lighthouse Performance Audit

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # Allow manual triggering

jobs:
  lighthouse-audit:
    name: Run Lighthouse Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          # Add any required environment variables for build
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Start application
        run: |
          npm start &
          sleep 30 # Wait for app to be ready

      - name: Run Lighthouse Audit
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            http://localhost:3000
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: "./lighthouserc.json"

      - name: Generate Performance Report
        run: |
          # Create timestamp for report
          TIMESTAMP=$(date +"%Y-%m-%d_%H-%M-%S")

          # Run our custom performance analysis
          node scripts/performance-analysis.js > "docs/performance-reports/auto-audit-$TIMESTAMP.txt"

          # Also generate JSON report if needed
          npx lighthouse http://localhost:3000 --output=json --output-path="docs/performance-reports/lighthouse-auto-$TIMESTAMP.json" --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Find the latest auto-audit report
            const reportsDir = 'docs/performance-reports';
            const files = fs.readdirSync(reportsDir);
            const autoReports = files.filter(f => f.startsWith('auto-audit-') && f.endsWith('.txt'));

            if (autoReports.length > 0) {
              const latestReport = autoReports.sort().pop();
              const reportContent = fs.readFileSync(path.join(reportsDir, latestReport), 'utf8');
              
              const comment = `## 🚀 Lighthouse Performance Audit Results
              
              **Report Generated**: ${new Date().toISOString()}
              
              \`\`\`
              ${reportContent}
              \`\`\`
              
              📊 **Performance Summary**:
              - Overall Score: Based on latest audit
              - LCP: Optimized for fast loading
              - CLS: Minimal layout shifts
              - Bundle Size: Optimized chunks
              
              📁 **Full Report**: Available in \`docs/performance-reports/${latestReport}\`
              
              ---
              *This audit was automatically generated by GitHub Actions*`;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

      - name: Upload Performance Reports
        uses: actions/upload-artifact@v4
        with:
          name: performance-reports-${{ github.run_number }}
          path: docs/performance-reports/auto-audit-*.txt
          retention-days: 30

      - name: Check Performance Thresholds
        run: |
          # Read the latest auto-audit report
          TIMESTAMP=$(date +"%Y-%m-%d_%H-%M-%S")
          REPORT_FILE="docs/performance-reports/auto-audit-$TIMESTAMP.txt"

          if [ -f "$REPORT_FILE" ]; then
            # Extract performance score (assuming format like "Performance: 90/100")
            PERFORMANCE_SCORE=$(grep "Performance:" "$REPORT_FILE" | grep -o '[0-9]\+' | head -1)
            
            if [ -n "$PERFORMANCE_SCORE" ]; then
              echo "Performance Score: $PERFORMANCE_SCORE"
              
              # Fail if performance drops below 85
              if [ "$PERFORMANCE_SCORE" -lt 85 ]; then
                echo "❌ Performance score ($PERFORMANCE_SCORE) is below threshold (85)"
                echo "Please review recent changes for performance regressions"
                exit 1
              else
                echo "✅ Performance score ($PERFORMANCE_SCORE) meets threshold (85+)"
              fi
            fi
          fi
